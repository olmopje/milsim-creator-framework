// THE MODULE-OWNED MENU EXPERIMENT.
//
// One preset, MCF_MapProbe, moved out of MCF_Core's chimeraMenus.conf and into
// the module that actually owns the class and the layout. Both files override
// vanilla's Configs/System/chimeraMenus.conf under the SAME GUID
// {C747AFB6B750CE9A}, and both append with `MenuPresets +{`.
//
// WHAT THIS DECIDES. If both files' presets survive, a module can register its
// own screens and MCF_Core never has to name them -- which is what lets a third
// party ship MYMOD_AI without editing Core. If instead the last addon in the
// load chain wins outright, Core's fourteen presets vanish the moment this file
// exists, and the manifest-in-Core stays.
//
// HOW TO READ THE RESULT IN GAME:
//   both work      -> appends merge. Module-owned menus are possible.
//   only the probe -> this file replaced Core's. Last-in-chain wins.
//   only the rest  -> this file was ignored. Core wins, modules cannot add.
MenuManager {
 MenuPresets +{
  MenuPreset MCF_MapProbe {
   Layout "{6A1C4F0B39E10000}UI/layouts/MCF/MCF_MapProbe.layout"
   ActionContext "MenuContext"
   Class "MCF_Map_ProbeMenu"
  }
 }
}
