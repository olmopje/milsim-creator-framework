  // THE GAME'S OWN MAP WINDOW, and its own input context.
  //
  // Layout: vanilla's MapMenu.layout, not a copy. Everything the map's UI
  // components look for by name lives in it, and CommandPostMapMenu -- the
  // game's own "use the map on a thing in the world" -- points at exactly
  // this same resource. A copy would only be a copy that drifts.
  //
  // ActionContext: MapContext, and this is not a detail. With MenuContext the
  // window opens and the map draws, but only the actions every menu shares
  // work: you can move up and down and nothing else. Panning sideways,
  // zooming and the right-click menu are all bound in MapContext, so without
  // it the map is a picture.
  MenuPreset MCF_MapBoardControl {
   Layout "{F87BB6B065B395D0}UI/layouts/Map/MapMenu.layout"
   ActionContext "MapContext"
   Class "MCF_Map_BoardControlMenu"
  }
