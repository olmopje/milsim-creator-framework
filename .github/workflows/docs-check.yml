name: Docs & structure check

# Note: this does NOT validate Enforce Script compilation and does NOT run
# Autotest suites or Stress Profiles — that requires Workbench, see
# ARCHITECTURE.md section 3.2. This workflow only checks what's realistically
# automatable without that environment.

on:
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: 'docs/**/*.md README.md CONTRIBUTING.md CHANGELOG.md'

      - name: Check for forbidden patterns (hard Faction Key instead of Alias)
        run: |
          if grep -rn "GetFaction(\"US\")\|GetFaction(\"USSR\")" addons/ 2>/dev/null; then
            echo "::error::Hard Faction Key found — use Faction Alias (see ARCHITECTURE.md 3.1)"
            exit 1
          fi

      - name: Check MCF_ prefix on new script files
        run: |
          for f in $(git diff --name-only origin/main...HEAD -- 'addons/MCF/Scripts/**/*.c' 2>/dev/null); do
            base=$(basename "$f")
            if [[ ! "$base" == MCF_* ]]; then
              echo "::warning::$f does not follow the MCF_ naming convention"
            fi
          done
