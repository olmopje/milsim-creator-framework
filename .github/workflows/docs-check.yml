name: Docs & structuur-check

# Let op: dit valideert GEEN Enforce Script-compilatie en draait GEEN
# Autotest-suites of Stress Profiles — dat vereist Workbench, zie
# ARCHITECTURE.md sectie 3.2. Deze workflow controleert alleen wat zonder
# die omgeving realistisch te automatiseren is.

on:
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: 'docs/**/*.md README.md CONTRIBUTING.md CHANGELOG.md'

      - name: Check op verboden patronen (harde Faction Key i.p.v. Alias)
        run: |
          if grep -rn "GetFaction(\"US\")\|GetFaction(\"USSR\")" addons/ 2>/dev/null; then
            echo "::error::Harde Faction Key gevonden — gebruik Faction Alias (zie ARCHITECTURE.md 3.1)"
            exit 1
          fi

      - name: Check op MCF_-prefix in nieuwe scriptbestanden
        run: |
          for f in $(git diff --name-only origin/main...HEAD -- 'addons/MCF/Scripts/**/*.c' 2>/dev/null); do
            base=$(basename "$f")
            if [[ ! "$base" == MCF_* ]]; then
              echo "::warning::$f volgt niet de MCF_-naamgevingsconventie"
            fi
          done
